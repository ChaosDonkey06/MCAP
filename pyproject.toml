[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcap"
version = "0.1.0"
description = "MCAP: Monte Carlo adjusted profile."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ChaosDonkey06" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5", "ruff>=0.6"]

[project.scripts]
mcap = "mcap.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
